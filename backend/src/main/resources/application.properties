spring.application.name=escaneo-backend
# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

# Lee la conexion a Neon desde backend/.env (copiar .env.example).
# Sin .env usa una base H2 local en ./data para que la demo funcione sin internet.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/escaneo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Origen permitido para el frontend fuera del proxy de Vite
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.openfoodfacts.enabled=${OFF_ENABLED:true}
